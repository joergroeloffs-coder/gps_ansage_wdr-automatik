<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fähr-Ansageautomatik</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ansage">
<style>
  :root {
    --bg: #f3f6fa;
    --surface: #ffffff;
    --text: #16202a;
    --text-muted: #5b6b7a;
    --border: #d7dee6;
    --accent: #1565c0;
    --accent-contrast: #ffffff;
    --secondary-bg: #e7edf4;
    --secondary-text: #16202a;
  }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: var(--bg); color: var(--text); }
  h1 { font-size: 1.3rem; margin-bottom: 0.75rem; }
  h2 { font-size: 1.1rem; margin: 1.25rem 0 0.6rem; }
  .status { padding: 0.75rem 1rem; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 1rem; font-size: 1.05rem; }
  .station { border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 0.9rem; background: var(--surface); }
  .station h3 { margin: 0 0 0.4rem 0; font-size: 1.1rem; }
  .badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 999px; font-size: 0.85rem; margin-right: 0.4rem; margin-bottom: 0.4rem; font-weight: 600; }
  .badge.far { background: #e2e8f0; color: #475569; }
  .badge.armed { background: #d7f5df; color: #1e7a37; }
  .badge.docked { background: #ffe6bd; color: #8a5a10; }
  .badge.triggered { background: #dbe4ee; color: #3a4b5c; }
  .log { display: none; font-size: 0.8rem; color: var(--text-muted); white-space: pre-wrap; max-height: 6rem; overflow-y: auto; background: var(--bg); border-radius: 8px; padding: 0.5rem; margin-top: 0.5rem; }
  body.show-logs .log { display: block; }
  button { padding: 0.95rem 1.4rem; border-radius: 12px; border: none; background: var(--accent); color: var(--accent-contrast); font-weight: 700; font-size: 1.05rem; margin-right: 0.6rem; margin-bottom: 0.6rem; }
  button.secondary { background: var(--secondary-bg); color: var(--secondary-text); }
  details.test-box { border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; margin-top: 1.25rem; background: var(--surface); }
  details.test-box summary { font-weight: 700; cursor: pointer; font-size: 1.05rem; }
  details.test-box label { display: block; font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-muted); }
  input[type=number] { width: 100%; padding: 0.6rem; box-sizing: border-box; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  input[type=range] { width: 100%; }
  select.berthSelect { width: 100%; padding: 0.7rem; margin-top: 0.4rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 1.05rem; }
  .berthLabel { font-size: 0.9rem; color: var(--text-muted); display: block; margin-top: 0.6rem; font-weight: 600; }
  .diagToggle { font-size: 0.9rem; color: var(--text-muted); margin: 0.75rem 0; display: flex; align-items: center; gap: 0.4rem; }
  .diagToggle input { width: 1.2rem; height: 1.2rem; }
  .iconBtn { width: 2.3rem; height: 2.3rem; padding: 0; border-radius: 50%; font-size: 1.15rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; margin: 0 0.5rem 0.5rem 0; vertical-align: middle; }
  .iconBtn.setRefBtn { background: var(--secondary-bg); color: var(--text); }
  .iconBtn.resetRefBtn { background: #fbdada; color: #b3261e; }
</style>
</head>
<body>
<h1>Fähr-Ansageautomatik (GPS)</h1>
<div class="status" id="globalStatus">GPS wird gestartet…</div>

<label class="berthLabel">Schiff (für Ansagen und Fahrplan-Automatik)</label>
<select class="berthSelect" id="shipSelect"></select>

<label class="berthLabel">Stimme für Ansagen (nur Notbehelf, falls keine Audiodatei vorliegt)</label>
<select class="berthSelect" id="voiceSelect"></select>

<button id="startBtn">GPS-Tracking starten</button>
<button id="stopBtn" class="secondary">Stoppen</button>

<label class="diagToggle"><input type="checkbox" id="diagToggle"> Protokoll/Diagnose anzeigen</label>

<h2>Fahrplan-Automatik</h2>
<div class="station">
  <label class="berthLabel"><input type="checkbox" id="autoModeCheckbox"> Automatikmodus: GPS-Tracking automatisch zu den Abfahrtszeiten des gewählten Schiffs ein-/ausschalten</label>
  <div id="autoModeStatus" style="font-size:0.9rem;color:var(--text-muted);margin-top:0.4rem;">Fahrplan wird geladen…</div>
  <button class="secondary" id="reloadFahrplanBtn">Fahrplan aktualisieren</button>
  <div class="log" id="fahrplanLog"></div>
</div>

<h2>Einlaufen</h2>
<div id="stations"></div>

<h2>Manuelle Zusatzansagen</h2>
<div class="station">
  <button id="autodeckBtn">Autodeck-Freigabe ansagen</button>
  <div class="log" id="secondaryLog"></div>
</div>

<h2>Ablegen</h2>
<div class="station" id="departurePanel">
  <span class="badge far" id="departureGlobalBadge">Ablegen: bereit</span>
  <div class="log" id="departureLog"></div>
</div>

<details class="test-box">
  <summary>Erweitert: Testmodus &amp; Diagnose</summary>
  <button class="secondary" id="testTtsBtn">TTS testen</button>
  <label>Testmodus aktiv (manuelle Position/Geschwindigkeit) <input type="checkbox" id="testMode"></label>
  <label>Breitengrad (lat)</label>
  <input type="number" id="testLat" step="0.0001" value="54.0000">
  <label>Längengrad (lon)</label>
  <input type="number" id="testLon" step="0.0001" value="10.0000">
  <label>Geschwindigkeit (km/h): <span id="testSpeedVal">0</span></label>
  <input type="range" id="testSpeed" min="0" max="30" step="0.5" value="0">
</details>

<script>
const state = {
  config: null,
  stations: {},   // id -> {armedArrival, lastDistance}
  departure: null, // siehe resetDepartureTracking()
  watchId: null,
  lastFix: null,  // {lat, lon, t} - Rohposition, für Geschwindigkeitsberechnung
  positionBuffer: [], // Rohpositionen der letzten positionSmoothingSeconds
  smoothedFix: null,  // {lat, lon, t} - geglättete Position, für Anlegen/Ablegen/Referenzposition
  selectedVoice: null,
  wakeLock: null,
  selectedShipKey: null,
  fahrplan: null,     // geladenes fahrplan_schedule.json
  autoModeOn: false,
  announcedScheduledDepartures: new Set(), // dedupe-Schlüssel bereits angesagter Fahrplan-Abfahrten
  lastDepartureAnnouncedAt: {},            // stationId -> Zeitstempel (ms), verhindert Doppelansage GPS+Fahrplan
};

// Verhindert doppelte Ablege-Ansagen, wenn GPS-Erkennung und
// Fahrplan-Zeit-Trigger für dieselbe Abfahrt beide auslösen würden.
function departureRecentlyAnnounced(stationId, withinMs = 20 * 60 * 1000) {
  const t = state.lastDepartureAnnouncedAt[stationId];
  return !!t && (Date.now() - t) < withinMs;
}

const SHIP_STORAGE_KEY = 'ansage-gewaehltes-schiff';

function currentShip() {
  const fleet = state.config.fleet || [];
  return fleet.find(s => s.key === state.selectedShipKey) || fleet[0] || null;
}

function log(el, msg) {
  const ts = new Date().toLocaleTimeString();
  el.textContent = `[${ts}] ${msg}\n` + el.textContent;
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Ersetzt Platzhalter wie {hafen} oder {schiff} in einer Textvorlage.
function renderTemplate(template, vars) {
  return template.replace(/\{(\w+)\}/g, (_, key) => (vars[key] ?? ''));
}

function templateVars(stationCfg) {
  const ship = currentShip();
  return {
    hafen: stationCfg ? stationCfg.name : '',
    schiff: ship ? ship.name : '',
  };
}

// Liefert den Einlaufen-Ansagetext für den aktuell ausgewählten Anleger-Typ
// (mit/ohne Seitenausstieg). Reihenfolge: stationsspezifischer Text >
// globale Vorlage > null (= kein Text hinterlegt, keine Ansage möglich).
function arrivalText(stationCfg, berthType) {
  const stationOverride = (stationCfg.arrival.texts || {})[berthType];
  if (stationOverride) return renderTemplate(stationOverride, templateVars(stationCfg));
  const tpl = ((state.config.textTemplates || {}).arrival || {})[berthType];
  return tpl ? renderTemplate(tpl, templateVars(stationCfg)) : null;
}

// Liefert die aktuell für diese Station ausgewählte Abfahrts-Route
// (Fahrtziel), oder die erste verfügbare, falls noch keine gewählt wurde.
function selectedRoute(stationCfg) {
  if (!stationCfg) return null;
  const routes = stationCfg.departureRoutes || [];
  if (!routes.length) return null;
  const st = state.stations[stationCfg.id];
  const routeId = st && st.selectedRoute;
  return routes.find(r => r.id === routeId) || routes[0];
}

function departureText(stationCfg) {
  const route = selectedRoute(stationCfg);
  if (route) return renderTemplate(route.text, templateVars(stationCfg));
  if (stationCfg && stationCfg.departure && stationCfg.departure.text) return renderTemplate(stationCfg.departure.text, templateVars(stationCfg));
  if (stationCfg) {
    const tpl = (state.config.textTemplates || {}).departure;
    if (tpl) return renderTemplate(tpl, templateVars(stationCfg));
  }
  return renderTemplate(departureConfig().genericText, templateVars(null));
}

// Dateinamen-Konvention für vorproduzierte Audiodateien (Ordner "audio/").
// Existiert die Datei nicht (404), wird automatisch auf Live-TTS (Gerätestimme)
// mit dem passenden Text zurückgefallen. Ein "?v="-Parameter (audioVersion in
// stations.json) sorgt dafür, dass Browser/CDN nach einer Aktualisierung der
// MP3s nicht versehentlich eine alte, gecachte Version weiterspielen.
function audioVersionSuffix() {
  const v = state.config.audioVersion;
  return v ? `?v=${v}` : '';
}
function arrivalAudioUrl(stationCfg, berthType) {
  return `audio/arrival_${stationCfg.id}_${berthType}.mp3${audioVersionSuffix()}`;
}
// Ablege-Ansagen enthalten den Schiffsnamen ({schiff}) und sind daher pro
// Schiff als eigene Audiodatei vorproduziert. Für Schiffe, für die noch
// keine Datei existiert, greift automatisch der Live-TTS-Fallback (mit dem
// korrekten Schiffsnamen, da der ja aus der Textvorlage kommt).
function departureAudioUrl(stationCfg) {
  const ship = currentShip();
  const shipSuffix = ship ? `_${ship.audioKey}` : '';
  const route = selectedRoute(stationCfg);
  const base = route
    ? `audio/departure_${stationCfg.id}_${route.id}${shipSuffix}.mp3`
    : (stationCfg ? `audio/departure_${stationCfg.id}${shipSuffix}.mp3` : `audio/departure_generic${shipSuffix}.mp3`);
  return base + audioVersionSuffix();
}
function autodeckAudioUrl() {
  return `audio/secondary_autodeck_freigabe.mp3${audioVersionSuffix()}`;
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('Sprachausgabe wird von diesem Browser nicht unterstützt.');
    return;
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = state.config.language || 'de-DE';
  if (state.selectedVoice) utter.voice = state.selectedVoice;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

// Spielt bevorzugt eine vorproduzierte Audiodatei ab (bessere, konstante
// Stimmqualität). Existiert die Datei nicht, fällt es automatisch auf die
// Live-Sprachausgabe (Gerätestimme) mit dem übergebenen Text zurück.
function playAnnouncement(audioUrl, fallbackText, logEl, label) {
  let handled = false;
  const fallback = () => {
    if (handled) return;
    handled = true;
    if (fallbackText) {
      speak(fallbackText);
      log(logEl, `${label}: Audiodatei "${audioUrl}" nicht gefunden – Sprachausgabe (Gerätestimme) verwendet.`);
    } else {
      log(logEl, `${label}: weder Audiodatei noch Text hinterlegt – keine Ansage möglich.`);
    }
  };
  const audio = new Audio(audioUrl);
  audio.addEventListener('error', fallback);
  audio.play().then(() => {
    if (!handled) { handled = true; log(logEl, `${label}: Audiodatei abgespielt (${audioUrl}).`); }
  }).catch(fallback);
}

// Stimmenauswahl (nur als Fallback relevant, wenn keine Audiodatei vorliegt):
// zeigt ausschließlich deutsche Stimmen, damit keine Akzent-Ausreißer aus
// anderen Sprachen zur Wahl stehen. Manche Browser liefern die Liste erst
// asynchron über "voiceschanged".
function populateVoiceList() {
  const select = document.getElementById('voiceSelect');
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  const previousValue = select.value;
  select.innerHTML = '';
  const german = voices
    .filter(v => v.lang.toLowerCase().startsWith('de'))
    .sort((a, b) => a.name.localeCompare(b.name));
  const list = german.length ? german : voices;
  list.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} (${v.lang})`;
    select.appendChild(opt);
  });

  const stillExists = list.some(v => v.voiceURI === previousValue);
  select.value = stillExists ? previousValue : list[0].voiceURI;
  state.selectedVoice = list.find(v => v.voiceURI === select.value) || null;
}

function bindVoiceSelect() {
  const select = document.getElementById('voiceSelect');
  select.addEventListener('change', () => {
    const voices = window.speechSynthesis.getVoices();
    state.selectedVoice = voices.find(v => v.voiceURI === select.value) || null;
  });
  populateVoiceList();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = populateVoiceList;
  }
}

const REFERENCE_POSITIONS_KEY = 'ansage-referenzpositionen';

function loadReferenceOverrides() {
  try { return JSON.parse(localStorage.getItem(REFERENCE_POSITIONS_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveReferenceOverrides(overrides) {
  try { localStorage.setItem(REFERENCE_POSITIONS_KEY, JSON.stringify(overrides)); }
  catch (e) { /* localStorage evtl. blockiert - Übersteuerung gilt dann nur für diese Sitzung */ }
}

// Übernimmt die aktuelle GPS-Position (laufendes Tracking oder einmalige
// Abfrage) als neuen Referenzpunkt für die Einlaufen-Erkennung dieser
// Station. Wird lokal gespeichert (localStorage) und überlebt Neuladen,
// überschreibt aber nicht stations.json selbst - "Zurücksetzen" stellt die
// Werte aus stations.json wieder her.
function setReferencePosition(stationCfg, logEl) {
  const apply = (lat, lon) => {
    stationCfg.lat = lat;
    stationCfg.lon = lon;
    const overrides = loadReferenceOverrides();
    overrides[stationCfg.id] = { lat, lon };
    saveReferenceOverrides(overrides);
    log(logEl, `Referenzposition gesetzt: ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
  };
  if (state.smoothedFix && (Date.now() - state.smoothedFix.t) < 30000) {
    apply(state.smoothedFix.lat, state.smoothedFix.lon);
    return;
  }
  if (!('geolocation' in navigator)) {
    log(logEl, 'Geolocation wird von diesem Browser nicht unterstützt.');
    return;
  }
  log(logEl, 'Ermittle aktuelle Position…');
  navigator.geolocation.getCurrentPosition(
    pos => apply(pos.coords.latitude, pos.coords.longitude),
    err => log(logEl, 'Position konnte nicht ermittelt werden: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function resetReferencePosition(stationCfg, logEl) {
  if (stationCfg._defaultLat === undefined) return;
  stationCfg.lat = stationCfg._defaultLat;
  stationCfg.lon = stationCfg._defaultLon;
  const overrides = loadReferenceOverrides();
  delete overrides[stationCfg.id];
  saveReferenceOverrides(overrides);
  log(logEl, `Referenzposition zurückgesetzt auf Standard: ${stationCfg.lat.toFixed(6)}, ${stationCfg.lon.toFixed(6)}`);
}

async function loadConfig() {
  const res = await fetch('stations.json', { cache: 'no-store' });
  state.config = await res.json();
  const overrides = loadReferenceOverrides();
  state.config.stations.forEach(s => {
    // Originalwerte aus stations.json merken, bevor eine lokale
    // Referenzposition (falls vorhanden) angewendet wird - für "Zurücksetzen".
    s._defaultLat = s.lat;
    s._defaultLon = s.lon;
    if (overrides[s.id]) {
      s.lat = overrides[s.id].lat;
      s.lon = overrides[s.id].lon;
    }
    state.stations[s.id] = {
      armedArrival: true,
      lastDistance: null,
      berthType: 'mitSeitenausstieg',
      selectedRoute: (s.departureRoutes && s.departureRoutes[0]) ? s.departureRoutes[0].id : null,
    };
  });
  resetDepartureTracking(null);
  renderStations();
  bindShipSelect();
}

// Färbt den Seitenhintergrund passend zum gewählten Schiff ein (rein
// optisch, damit auf einen Blick erkennbar ist, für welches Schiff die App
// gerade eingestellt ist).
function applyShipBackground() {
  const ship = currentShip();
  document.documentElement.style.setProperty('--bg', (ship && ship.bgColor) || '#f3f6fa');
}

function bindShipSelect() {
  const select = document.getElementById('shipSelect');
  const fleet = state.config.fleet || [];
  select.innerHTML = fleet.map(s => `<option value="${s.key}">${s.name}</option>`).join('');

  let saved = null;
  try { saved = localStorage.getItem(SHIP_STORAGE_KEY); } catch (e) { /* localStorage evtl. blockiert */ }
  state.selectedShipKey = fleet.some(s => s.key === saved) ? saved : (state.config.defaultShipKey || (fleet[0] || {}).key);
  select.value = state.selectedShipKey;
  applyShipBackground();

  select.addEventListener('change', () => {
    state.selectedShipKey = select.value;
    try { localStorage.setItem(SHIP_STORAGE_KEY, select.value); } catch (e) { /* ignore */ }
    applyShipBackground();
    updateAutoModeStatus();
    reorderStations();
  });
}

// Liefert die Minuten bis zur nächsten heutigen Fahrplan-Abfahrt des
// gewählten Schiffs ab dieser Station (Infinity, falls keine gefunden wird
// oder kein Fahrplan geladen ist) - Grundlage für die Sortierung der
// Einlaufen-Karten nach "als nächstes relevanter Hafen".
function minutesUntilNextDeparture(stationCfg) {
  if (!state.fahrplan || !state.fahrplan.schiffe || !stationCfg.fahrplanHafen) return Infinity;
  const ship = currentShip();
  if (!ship) return Infinity;
  const eintraege = state.fahrplan.schiffe[ship.key] || [];
  const now = new Date();
  const isoHeute = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  const nowMinuten = now.getHours() * 60 + now.getMinutes();

  const minuten = eintraege
    .filter(e => e.datum === isoHeute && e.route.startsWith(stationCfg.fahrplanHafen + '-'))
    .map(e => { const [h, m] = e.zeit.split(':').map(Number); return h * 60 + m; })
    .filter(m => m >= nowMinuten - 5)
    .sort((a, b) => a - b);

  return minuten.length ? (minuten[0] - nowMinuten) : Infinity;
}

// Bringt die Hafen-Karten unter "Einlaufen" in die Reihenfolge, in der ihre
// Häfen als nächstes laut Fahrplan angelaufen/verlassen werden - der oberste
// Hafen ist also der aktuell relevanteste. Bewegt bestehende DOM-Elemente
// (statt sie neu zu erzeugen), damit Log-Verläufe und Auswahl erhalten
// bleiben.
function reorderStations() {
  const container = document.getElementById('stations');
  if (!container || !state.config) return;
  const sortiert = [...state.config.stations].sort(
    (a, b) => minutesUntilNextDeparture(a) - minutesUntilNextDeparture(b)
  );
  sortiert.forEach(s => {
    const el = document.getElementById('station-' + s.id);
    if (el) container.appendChild(el);
  });
}

function renderStations() {
  const container = document.getElementById('stations');
  container.innerHTML = '';
  state.config.stations.forEach(s => {
    const div = document.createElement('div');
    div.className = 'station';
    div.id = 'station-' + s.id;
    div.innerHTML = `
      <h3>${s.name}</h3>
      <div>Distanz: <span class="dist">–</span> m</div>
      <span class="badge arrivalBadge far">Einlaufen: bereit</span>
      <div>
        <button class="iconBtn setRefBtn" title="Referenzposition hier setzen" aria-label="Referenzposition hier setzen">⌖</button>
        <button class="iconBtn resetRefBtn" title="Referenzposition zurücksetzen" aria-label="Referenzposition zurücksetzen">✕</button>
      </div>
      <label class="berthLabel">Anleger für die nächste Ankunft</label>
      <select class="berthSelect" data-station="${s.id}">
        <option value="mitSeitenausstieg">Mit Seitenausstieg</option>
        <option value="ohneSeitenausstieg">Ohne Seitenausstieg</option>
      </select>
      <div>
        <button class="secondary previewBtn" data-berth="ohneSeitenausstieg">Vorhören: ohne Seitenausstieg</button>
        <button class="secondary previewBtn" data-berth="mitSeitenausstieg">Vorhören: mit Seitenausstieg</button>
      </div>
      ${(s.departureRoutes && s.departureRoutes.length) ? `
      <label class="berthLabel">Fahrtziel für die nächste Abfahrt</label>
      <select class="routeSelect">
        ${s.departureRoutes.map(r => `<option value="${r.id}">${r.label}</option>`).join('')}
      </select>
      <div><button class="secondary previewDepartureBtn">Vorhören: Ablegen</button></div>
      ` : ''}
      <div class="log"></div>
    `;
    div.querySelector('.berthSelect').addEventListener('change', e => {
      state.stations[s.id].berthType = e.target.value;
    });
    div.querySelectorAll('.previewBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const berth = btn.dataset.berth;
        playAnnouncement(arrivalAudioUrl(s, berth), arrivalText(s, berth), div.querySelector('.log'), 'Vorhören Einlaufen (' + berth + ')');
      });
    });
    const routeSelect = div.querySelector('.routeSelect');
    if (routeSelect) {
      routeSelect.addEventListener('change', e => {
        state.stations[s.id].selectedRoute = e.target.value;
      });
    }
    const previewDepartureBtn = div.querySelector('.previewDepartureBtn');
    if (previewDepartureBtn) {
      previewDepartureBtn.addEventListener('click', () => {
        playAnnouncement(departureAudioUrl(s), departureText(s), div.querySelector('.log'), 'Vorhören Ablegen');
      });
    }
    div.querySelector('.setRefBtn').addEventListener('click', () => setReferencePosition(s, div.querySelector('.log')));
    div.querySelector('.resetRefBtn').addEventListener('click', () => resetReferencePosition(s, div.querySelector('.log')));
    container.appendChild(div);
  });
}

// --- Einlaufen: klassische Geofence-Annäherung mit Hysterese ---
function evaluateArrival(stationCfg, distance) {
  const st = state.stations[stationCfg.id];
  const el = document.getElementById('station-' + stationCfg.id);
  el.querySelector('.dist').textContent = distance.toFixed(1);
  const hyst = state.config.hysteresisFactor || 1.5;
  const arrivalBadge = el.querySelector('.arrivalBadge');
  const arrRadius = stationCfg.arrival.radiusMeters;

  if (distance <= arrRadius && st.armedArrival) {
    playAnnouncement(
      arrivalAudioUrl(stationCfg, st.berthType),
      arrivalText(stationCfg, st.berthType),
      el.querySelector('.log'),
      'Einlaufen-Ansage'
    );
    st.armedArrival = false;
    arrivalBadge.textContent = 'Einlaufen: ausgelöst';
    arrivalBadge.className = 'badge triggered arrivalBadge';
  } else if (distance > arrRadius * hyst && !st.armedArrival) {
    st.armedArrival = true;
    arrivalBadge.textContent = 'Einlaufen: bereit';
    arrivalBadge.className = 'badge far arrivalBadge';
  } else if (st.armedArrival) {
    arrivalBadge.textContent = distance <= arrRadius * hyst ? 'Einlaufen: nähert sich' : 'Einlaufen: bereit';
    arrivalBadge.className = 'badge ' + (distance <= arrRadius * hyst ? 'armed' : 'far') + ' arrivalBadge';
  }

  st.lastDistance = distance;
}

// --- Ablegen: dynamische Anlege-Erkennung + Bewegungserkennung ---
// 1) Das Schiff gilt als "angelegt", sobald es sich länger als
//    stableDurationMinutes nicht weiter als stableRadiusMeters von einer
//    Position entfernt hat. Diese Position wird als Ablege-Anker gemerkt.
// 2) Die Ablege-Ansage wird ausgelöst, sobald sich das Schiff von diesem
//    Anker aus innerhalb von departureWindowMinutes um mehr als
//    departureRadiusMeters entfernt (schnelle Bewegung = echtes Ablegen,
//    langsames Wegdriften löst nichts aus).
function departureConfig() {
  const cfg = state.config.departureDetection || {};
  return {
    stableRadius: cfg.stableRadiusMeters ?? 35,
    stableDurationMs: (cfg.stableDurationMinutes ?? 7) * 60000,
    driftToleranceMs: (cfg.driftToleranceSeconds ?? 60) * 1000,
    departureRadius: cfg.departureRadiusMeters ?? 50,
    departureWindowMs: (cfg.departureWindowMinutes ?? 2) * 60000,
    stationMatchRadius: cfg.stationMatchRadiusMeters ?? 300,
    genericText: cfg.genericText || 'Wir legen jetzt ab. Bitte nehmen Sie Platz.',
  };
}

function formatMinSec(ms) {
  const totalSec = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function findNearestStation(lat, lon, maxDist) {
  let best = null, bestDist = Infinity;
  (state.config.stations || []).forEach(s => {
    const d = haversineMeters(lat, lon, s.lat, s.lon);
    if (d < bestDist) { bestDist = d; best = s; }
  });
  return (best && bestDist <= maxDist) ? best : null;
}

// Ermittelt anhand von fahrplan_schedule.json die nächste heutige Abfahrt
// des gewählten Schiffs ab diesem Hafen (zeitlich ab jetzt) und liefert die
// passende Route-ID aus stationCfg.departureRoutes zurück (oder null, wenn
// kein Fahrplan/keine passende Abfahrt gefunden wurde). "direkt" markierte
// Abfahrten (Schiff fährt ohne Zwischenstopp durch) werden auf die
// entsprechende "über Wyk..."-Route gemappt.
function autoRouteForStation(stationCfg) {
  if (!state.fahrplan || !state.fahrplan.schiffe || !stationCfg.fahrplanHafen) return null;
  const ship = currentShip();
  if (!ship) return null;
  const eintraege = state.fahrplan.schiffe[ship.key] || [];

  const now = new Date();
  const isoHeute = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  const nowMinuten = now.getHours() * 60 + now.getMinutes();

  const passende = eintraege
    .filter(e => e.datum === isoHeute && e.route.startsWith(stationCfg.fahrplanHafen + '-'))
    .map(e => {
      const [h, m] = e.zeit.split(':').map(Number);
      return { ...e, minuten: h * 60 + m };
    })
    .filter(e => e.minuten >= nowMinuten - 5) // kleine Toleranz für knapp verpasste Zeit
    .sort((a, b) => a.minuten - b.minuten);

  if (!passende.length) return null;
  const naechste = passende[0];

  const routes = stationCfg.departureRoutes || [];
  const treffer = routes.find(r => r.fahrplanMatch && r.fahrplanMatch.direkt === naechste.direkt);
  return treffer ? { routeId: treffer.id, quelle: naechste } : null;
}

// Wendet die Fahrplan-Erkennung an und aktualisiert Dropdown + State, falls
// ein Treffer gefunden wurde (loggt das Ergebnis, ändert aber nichts, wenn
// nichts gefunden wird - dann bleibt die zuletzt gewählte/Standard-Route).
function applyAutoRoute(stationCfg, logEl) {
  const ergebnis = autoRouteForStation(stationCfg);
  if (!ergebnis) return;
  const st = state.stations[stationCfg.id];
  st.selectedRoute = ergebnis.routeId;
  const select = document.querySelector(`#station-${stationCfg.id} .routeSelect`);
  if (select) select.value = ergebnis.routeId;
  const route = (stationCfg.departureRoutes || []).find(r => r.id === ergebnis.routeId);
  log(logEl, `Fahrtziel automatisch aus Fahrplan übernommen (Abfahrt ${ergebnis.quelle.zeit}): ${route ? route.label : ergebnis.routeId}`);
}

function setDepartureBadge(text, cls) {
  const badge = document.getElementById('departureGlobalBadge');
  badge.textContent = 'Ablegen: ' + text;
  badge.className = 'badge ' + cls;
}

function resetDepartureTracking(fix) {
  state.departure = {
    anchor: fix,          // {lat, lon, t} – Startpunkt des aktuellen Stillstandsfensters
    lastInsideAt: fix ? fix.t : null, // letzter Zeitpunkt innerhalb von stableRadius
    dockConfirmed: false,
    dockAnchor: null,
    buffer: [],           // {t, distance} der letzten departureWindowMinutes
    matchedStation: null,
  };
  setDepartureBadge('bereit', 'far');
}

function processDeparture(lat, lon, t) {
  const cfg = departureConfig();
  const dep = state.departure;
  const logEl = document.getElementById('departureLog');

  if (!dep.anchor) {
    dep.anchor = { lat, lon, t };
    dep.lastInsideAt = t;
    return;
  }

  if (!dep.dockConfirmed) {
    const d = haversineMeters(dep.anchor.lat, dep.anchor.lon, lat, lon);
    if (d <= cfg.stableRadius) {
      dep.lastInsideAt = t;
      const elapsed = t - dep.anchor.t;
      if (elapsed >= cfg.stableDurationMs) {
        // Stillstand allein reicht nicht als "Anlegen" - das Schiff könnte
        // auch mitten auf der Strecke warten (Verkehr, Ankern etc.). Nur ein
        // Stillstand in der Nähe eines konfigurierten Hafens zählt.
        const matched = findNearestStation(dep.anchor.lat, dep.anchor.lon, cfg.stationMatchRadius);
        if (!matched) {
          log(logEl, `Stillstand erkannt, aber kein Hafen in ${cfg.stationMatchRadius}m Nähe – gilt nicht als Anlegen.`);
          dep.anchor = { lat, lon, t };
          dep.lastInsideAt = t;
          setDepartureBadge('bereit', 'far');
        } else {
          dep.dockConfirmed = true;
          dep.dockAnchor = { lat: dep.anchor.lat, lon: dep.anchor.lon };
          dep.buffer = [{ t, distance: 0 }];
          dep.matchedStation = matched;
          setDepartureBadge(`liegt an (${matched.name})`, 'docked');
          log(logEl, `Anlegen erkannt (${matched.name}) – wartet auf Ablegen.`);
          applyAutoRoute(matched, logEl);
        }
      } else {
        setDepartureBadge(`wartet (${formatMinSec(elapsed)} von ${formatMinSec(cfg.stableDurationMs)})`, 'armed');
      }
    } else {
      // Kurze GPS-Ausreißer (z.B. durch Stahlrumpf) werden toleriert: erst nach
      // driftToleranceMs außerhalb von stableRadius gilt das als echte Bewegung.
      const outsideDuration = t - (dep.lastInsideAt || dep.anchor.t);
      if (outsideDuration > cfg.driftToleranceMs) {
        log(logEl, `Position hat sich um ${Math.round(d)}m verändert – Stillstands-Messung neu gestartet.`);
        dep.anchor = { lat, lon, t };
        dep.lastInsideAt = t;
        setDepartureBadge('bereit', 'far');
      }
      // sonst: als GPS-Ausreißer ignorieren, Zeitfenster läuft weiter
    }
    return;
  }

  // Angelegt: auf Ablegen warten
  const d = haversineMeters(dep.dockAnchor.lat, dep.dockAnchor.lon, lat, lon);
  dep.buffer.push({ t, distance: d });
  dep.buffer = dep.buffer.filter(entry => t - entry.t <= cfg.departureWindowMs);
  const wasNearRecently = dep.buffer.some(entry => entry.distance <= cfg.stableRadius);

  if (d > cfg.departureRadius && wasNearRecently) {
    if (dep.matchedStation && departureRecentlyAnnounced(dep.matchedStation.id)) {
      log(logEl, 'Ablegen per GPS erkannt, aber Ansage wurde für diesen Hafen bereits (z.B. per Fahrplan-Zeit) ausgelöst – übersprungen.');
    } else {
      playAnnouncement(departureAudioUrl(dep.matchedStation), departureText(dep.matchedStation), logEl, 'Ablege-Ansage');
      if (dep.matchedStation) state.lastDepartureAnnouncedAt[dep.matchedStation.id] = Date.now();
    }
    resetDepartureTracking({ lat, lon, t });
  } else if (d > cfg.departureRadius && !wasNearRecently) {
    log(logEl, 'Position langsam verlassen (kein Ablegen erkannt) – Erkennung wird zurückgesetzt.');
    resetDepartureTracking({ lat, lon, t });
  }
}

function computeSpeedKmh(lat, lon, timestamp, reportedSpeedMs) {
  if (typeof reportedSpeedMs === 'number' && !isNaN(reportedSpeedMs)) {
    return reportedSpeedMs * 3.6;
  }
  if (state.lastFix) {
    const dt = (timestamp - state.lastFix.t) / 1000;
    if (dt > 0) {
      const d = haversineMeters(state.lastFix.lat, state.lastFix.lon, lat, lon);
      return (d / dt) * 3.6;
    }
  }
  return 0;
}

// Glättet die GPS-Position über ein gleitendes Zeitfenster (Default 15s):
// statt jede einzelne (verrauschte) Rohposition direkt zu verwenden, wird
// der Mittelwert aller Positionen der letzten positionSmoothingSeconds
// gebildet. Wichtig fürs Anlegen/Ablegen, wo es auf eine stabile
// "Parkposition" statt auf einzelne GPS-Ausreißer ankommt.
function updateSmoothedPosition(lat, lon, t) {
  const windowMs = (state.config.positionSmoothingSeconds ?? 15) * 1000;
  state.positionBuffer.push({ lat, lon, t });
  state.positionBuffer = state.positionBuffer.filter(p => t - p.t <= windowMs);
  const n = state.positionBuffer.length;
  const avgLat = state.positionBuffer.reduce((sum, p) => sum + p.lat, 0) / n;
  const avgLon = state.positionBuffer.reduce((sum, p) => sum + p.lon, 0) / n;
  state.smoothedFix = { lat: avgLat, lon: avgLon, t };
  return state.smoothedFix;
}

function handlePosition(lat, lon, timestamp, reportedSpeedMs) {
  const speedKmh = computeSpeedKmh(lat, lon, timestamp, reportedSpeedMs);
  const smoothed = updateSmoothedPosition(lat, lon, timestamp);
  document.getElementById('globalStatus').textContent =
    `Position: ${lat.toFixed(5)}, ${lon.toFixed(5)} (geglättet: ${smoothed.lat.toFixed(5)}, ${smoothed.lon.toFixed(5)}) | Geschwindigkeit: ${speedKmh.toFixed(1)} km/h`;
  state.config.stations.forEach(s => {
    const distance = haversineMeters(smoothed.lat, smoothed.lon, s.lat, s.lon);
    evaluateArrival(s, distance);
  });
  processDeparture(smoothed.lat, smoothed.lon, timestamp);
  state.lastFix = { lat, lon, t: timestamp };
}

// Verhindert, dass sich der Bildschirm während des Trackings von selbst
// abschaltet (Screen Wake Lock API). Wird der Lock vom System entzogen
// (z.B. Tab kurz in den Hintergrund), holen wir ihn beim Wiedersichtbarwerden
// automatisch erneut, solange getrackt wird.
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) {
    log(document.getElementById('secondaryLog'), 'Wach-Halten nicht unterstützt – Bildschirm kann sich während der Fahrt selbst abschalten.');
    return;
  }
  try {
    state.wakeLock = await navigator.wakeLock.request('screen');
    state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
  } catch (err) {
    log(document.getElementById('secondaryLog'), 'Wach-Halten konnte nicht aktiviert werden: ' + err.message);
  }
}

function releaseWakeLock() {
  if (state.wakeLock) {
    state.wakeLock.release();
    state.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.watchId !== null && !state.wakeLock) {
    acquireWakeLock();
  }
});

function startTracking() {
  if (document.getElementById('testMode').checked) {
    document.getElementById('globalStatus').textContent = 'Testmodus aktiv – manuelle Werte werden verwendet.';
    return;
  }
  if (!('geolocation' in navigator)) {
    document.getElementById('globalStatus').textContent = 'Geolocation wird nicht unterstützt.';
    return;
  }
  state.watchId = navigator.geolocation.watchPosition(
    pos => handlePosition(pos.coords.latitude, pos.coords.longitude, pos.timestamp, pos.coords.speed),
    err => { document.getElementById('globalStatus').textContent = 'GPS-Fehler: ' + err.message; },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );
  acquireWakeLock();
}

function stopTracking() {
  if (state.watchId !== null) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
  releaseWakeLock();
  document.getElementById('globalStatus').textContent = 'Tracking gestoppt.';
}

// --- Fahrplan-Automatik ---
// Lädt fahrplan_schedule.json aus dem dienstplan-Repo (Cross-Origin-Fetch von
// raw.githubusercontent.com, wird dort stündlich per GitHub Action aktualisiert)
// und ermittelt daraus, ob das gewählte Schiff heute laut Fahrplan im Einsatz
// sein sollte. Im Automatikmodus schaltet das GPS-Tracking entsprechend
// automatisch ein/aus.
async function loadFahrplan() {
  const url = state.config.fahrplanScheduleUrl;
  const logEl = document.getElementById('fahrplanLog');
  if (!url) { updateAutoModeStatus(); return; }
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.fahrplan = await res.json();
    log(logEl, `Fahrplan geladen (Stand: ${state.fahrplan.generated_at || 'unbekannt'}).`);
  } catch (err) {
    log(logEl, 'Fahrplan konnte nicht geladen werden: ' + err.message);
  }
  updateAutoModeStatus();
  applyAutoMode();
  // Falls das Schiff schon angelegt hat (z.B. Fahrplan war beim Anlegen noch
  // nicht geladen), Fahrtziel jetzt nachträglich automatisch setzen.
  if (state.departure && state.departure.dockConfirmed && state.departure.matchedStation) {
    applyAutoRoute(state.departure.matchedStation, document.getElementById('fahrplanLog'));
  }
  checkScheduledDepartures();
  reorderStations();
}

// Heutige Abfahrten des gewählten Schiffs, chronologisch.
function todaysDeparturesForShip() {
  if (!state.fahrplan || !state.fahrplan.schiffe) return [];
  const ship = currentShip();
  if (!ship) return [];
  const heute = new Date();
  const isoHeute = heute.getFullYear() + '-' +
    String(heute.getMonth() + 1).padStart(2, '0') + '-' +
    String(heute.getDate()).padStart(2, '0');
  const eintraege = state.fahrplan.schiffe[ship.key] || [];
  return eintraege.filter(e => e.datum === isoHeute);
}

// Liefert {active, from, to, first, last} für das heutige Einsatzfenster
// (erste Abfahrt minus Vorlaufzeit bis letzte Abfahrt plus Nachlaufzeit).
function todaysServiceWindow() {
  const abfahrten = todaysDeparturesForShip();
  if (!abfahrten.length) return null;
  const cfg = state.config.autoTracking || {};
  const leadMs = (cfg.leadMinutes ?? 15) * 60000;
  const lagMs = (cfg.lagMinutes ?? 40) * 60000;

  const zeitZuDate = zeit => {
    const [h, m] = zeit.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  };

  const zeiten = abfahrten.map(a => zeitZuDate(a.zeit)).sort((a, b) => a - b);
  const first = zeiten[0];
  const last = zeiten[zeiten.length - 1];
  const from = new Date(first.getTime() - leadMs);
  const to = new Date(last.getTime() + lagMs);
  const now = new Date();
  return { active: now >= from && now <= to, from, to, first, last };
}

function formatTime(d) {
  return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function updateAutoModeStatus() {
  const el = document.getElementById('autoModeStatus');
  if (!state.fahrplan) { el.textContent = 'Fahrplan noch nicht geladen.'; return; }
  const ship = currentShip();
  const win = todaysServiceWindow();
  if (!win) {
    el.textContent = `${ship ? ship.name : 'Schiff'}: heute keine Abfahrten im Fahrplan gefunden.`;
    return;
  }
  el.textContent = win.active
    ? `${ship.name}: heute im Einsatz von ${formatTime(win.from)} bis ${formatTime(win.to)} – aktuell aktiv.`
    : `${ship.name}: heute im Einsatz von ${formatTime(win.from)} bis ${formatTime(win.to)} – aktuell außerhalb des Fensters.`;
}

// Prüft (im Automatikmodus) ob GPS-Tracking laut Fahrplan gerade laufen
// sollte, und startet/stoppt es entsprechend.
function applyAutoMode() {
  if (!state.autoModeOn) return;
  const win = todaysServiceWindow();
  const shouldRun = !!(win && win.active);
  const logEl = document.getElementById('fahrplanLog');
  if (shouldRun && state.watchId === null) {
    log(logEl, 'Automatik: Einsatzfenster erreicht – GPS-Tracking wird gestartet.');
    startTracking();
  } else if (!shouldRun && state.watchId !== null) {
    log(logEl, 'Automatik: Einsatzfenster beendet – GPS-Tracking wird gestoppt.');
    stopTracking();
  }
  updateAutoModeStatus();
}

// Ablege-Ansage per Systemzeit statt GPS-Bewegungserkennung: da die App
// (noch) nicht durchgehend im Hintergrund laufen kann, reicht die
// GPS-Anker-Erkennung (7 Minuten Stillstand nötig) oft nicht aus. Als
// Ergänzung wird hier jede heutige Fahrplan-Abfahrt des gewählten Schiffs
// geprüft: eine Minute vor der geplanten Zeit wird die Ansage direkt anhand
// des Fahrplans ausgelöst (Route wie bei applyAutoRoute ermittelt). Läuft
// im selben 60-Sekunden-Takt wie die Automatik-Prüfung; ein Dedupe-Set
// verhindert Mehrfachauslösung, departureRecentlyAnnounced() verhindert
// eine doppelte Ansage, falls GPS die gleiche Abfahrt ebenfalls erkennt.
function checkScheduledDepartures() {
  if (!state.fahrplan || !state.fahrplan.schiffe) return;
  const ship = currentShip();
  if (!ship) return;
  const eintraege = state.fahrplan.schiffe[ship.key] || [];
  const logEl = document.getElementById('fahrplanLog');
  const now = new Date();
  const isoHeute = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  (state.config.stations || []).forEach(stationCfg => {
    if (!stationCfg.fahrplanHafen) return;
    eintraege
      .filter(e => e.datum === isoHeute && e.route.startsWith(stationCfg.fahrplanHafen + '-'))
      .forEach(e => {
        const [h, m] = e.zeit.split(':').map(Number);
        const abfahrtZeit = new Date(now);
        abfahrtZeit.setHours(h, m, 0, 0);
        const diffMs = abfahrtZeit.getTime() - now.getTime();
        // Fenster von 90 bis 30 Sekunden vor Abfahrt = "eine Minute vorher",
        // mit Toleranz für den 60-Sekunden-Prüftakt.
        if (diffMs > 90000 || diffMs < 30000) return;

        const key = `${ship.key}|${e.datum}|${e.zeit}|${e.route}`;
        if (state.announcedScheduledDepartures.has(key)) return;
        state.announcedScheduledDepartures.add(key);

        if (departureRecentlyAnnounced(stationCfg.id)) {
          log(logEl, `Fahrplan-Abfahrt ${e.zeit} (${stationCfg.name}) übersprungen – kürzlich bereits angesagt.`);
          return;
        }
        const routes = stationCfg.departureRoutes || [];
        const treffer = routes.find(r => r.fahrplanMatch && r.fahrplanMatch.direkt === e.direkt);
        if (!treffer) {
          log(logEl, `Fahrplan-Abfahrt ${e.zeit} (${stationCfg.name}): keine passende Route für Ansage gefunden.`);
          return;
        }
        state.stations[stationCfg.id].selectedRoute = treffer.id;
        const select = document.querySelector(`#station-${stationCfg.id} .routeSelect`);
        if (select) select.value = treffer.id;
        playAnnouncement(
          departureAudioUrl(stationCfg),
          departureText(stationCfg),
          logEl,
          `Ablege-Ansage nach Fahrplan (${e.zeit} ab ${stationCfg.name})`
        );
        state.lastDepartureAnnouncedAt[stationCfg.id] = Date.now();
      });
  });
}

// Testmodus: manuelle Eingaben live auswerten (Zeit läuft dabei real weiter,
// d.h. die 7-Minuten-/2-Minuten-Fenster für das Ablegen gelten auch hier).
function bindTestInputs() {
  const latInput = document.getElementById('testLat');
  const lonInput = document.getElementById('testLon');
  const speedInput = document.getElementById('testSpeed');
  const speedVal = document.getElementById('testSpeedVal');

  function applyTestFix() {
    if (!document.getElementById('testMode').checked) return;
    const lat = parseFloat(latInput.value);
    const lon = parseFloat(lonInput.value);
    const speedKmh = parseFloat(speedInput.value);
    speedVal.textContent = speedKmh;
    const t = Date.now();
    document.getElementById('globalStatus').textContent =
      `[Test] Position: ${lat.toFixed(5)}, ${lon.toFixed(5)} | Geschwindigkeit: ${speedKmh.toFixed(1)} km/h`;
    state.config.stations.forEach(s => {
      const distance = haversineMeters(lat, lon, s.lat, s.lon);
      evaluateArrival(s, distance);
    });
    processDeparture(lat, lon, t);
  }

  [latInput, lonInput, speedInput].forEach(inp => inp.addEventListener('input', applyTestFix));
}
